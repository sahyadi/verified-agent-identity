name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'tambomk'
        required: true
        default: 'tambomk'
      agent_description:
        description: 'tambomk'
        required: true
        default: 'tambomk AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Step 1 - Install ClawHub skill
        run: npx clawhub@latest install verified-agent-identity

      - name: Install script dependencies
        working-directory: scripts
        run: npm install

      - name: Step 2 - Create new Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Step 3 - Link Human to Agent
        run: |
          node scripts/manualLinkHumanToAgent.js --challenge '{"name": "tambomk", "description": "tambomk AI Agent"}'
